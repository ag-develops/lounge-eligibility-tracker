name: Refresh lounge eligibility data

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: lounge-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh card data
        run: python scrapers/scraper.py

      - name: Commit and push changed card data
        run: |
          if git diff --quiet -- data/cards.json; then
            echo "data/cards.json is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "chore: refresh lounge eligibility data"
          git push origin HEAD:main